# Local stack: Postgres plus the API. Flyway builds the schema on first boot.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corepay
      POSTGRES_USER: corepay
      POSTGRES_PASSWORD: corepay
    ports:
      - "5442:5432"
    volumes:
      - corepay-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corepay -d corepay"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/corepay
      DATABASE_USER: corepay
      DATABASE_PASSWORD: corepay
      JWT_SECRET: local-development-secret-change-me-please
    ports:
      - "8085:8080"

volumes:
  corepay-db:
