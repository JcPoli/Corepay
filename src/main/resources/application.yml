spring:
  application:
    name: corepay
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/corepay}
    username: ${DATABASE_USER:corepay}
    password: ${DATABASE_PASSWORD:corepay}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never touch it: an ORM that can
      # alter a ledger table is an audit finding waiting to happen.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

corepay:
  security:
    # Override in every real environment. 32+ chars: it keys HMAC-SHA256.
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-please}
    token-validity-minutes: ${JWT_VALIDITY_MINUTES:60}
    demo-users:
      - username: teller
        password: ${TELLER_PASSWORD:teller-demo}
        roles: TELLER
      - username: auditor
        password: ${AUDITOR_PASSWORD:auditor-demo}
        roles: AUDITOR
  statements:
    # Local disk by default so the app boots with no cloud credentials.
    # Set storage=s3 plus the bucket to exercise the S3 adapter.
    storage: ${STATEMENT_STORAGE:local}
    local-directory: ${STATEMENT_DIR:./build/statements}
    s3-bucket: ${STATEMENT_BUCKET:}
    s3-region: ${AWS_REGION:me-central-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  port: ${PORT:8080}
  error:
    include-message: never

logging:
  level:
    dev.jcpolicarpio.corepay: INFO
