# Render blueprint. Point Render at this repo and it builds the Dockerfile,
# provisions Postgres, and wires DATABASE_URL in.
#
# Note: free instances sleep when idle, so the first request after a quiet
# spell takes around half a minute to answer.
services:
  - type: web
    name: corepay
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      # Render's connectionString is a postgresql:// URI; Spring needs a JDBC
      # URL, so it is assembled from the host, port and database instead.
      - key: DATABASE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - key: DB_HOST
        fromDatabase:
          name: corepay-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: corepay-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: corepay-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: corepay-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: corepay-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:TieredStopAtLevel=1 -Dspring.jmx.enabled=false"
      - key: TELLER_PASSWORD
        sync: false
      - key: AUDITOR_PASSWORD
        sync: false

databases:
  - name: corepay-db
    plan: free
    databaseName: corepay
    user: corepay
